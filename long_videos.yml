name: Gadget Pulse Malayalam Long Videos (Mon/Wed/Sat 9:00 PM IST)

on:
  schedule:
    # 14:13 UTC = 7:43 PM IST (Mon, Wed, Sat) -> Build 8-9 min video & upload YT (publishAt 9:00 PM IST)
    - cron: "13 14 * * 1,3,6"
    # 15:43 UTC = 9:13 PM IST (Mon, Wed, Sat) -> Publish to Facebook Page Videos
    - cron: "43 15 * * 1,3,6"
  workflow_dispatch:
    inputs:
      action_mode:
        description: "Run mode"
        required: false
        default: "full_743pm_build"
        type: choice
        options:
          - "full_743pm_build"
          - "publish_fb_now"
      category_override:
        description: "Video series type"
        required: false
        default: "auto_by_day"
        type: choice
        options:
          - "auto_by_day"
          - "top5_budget"
          - "smart_home_guide"
          - "weekly_launches"

permissions:
  contents: write
  actions: read

jobs:
  build-long-video:
    if: github.event.schedule == '13 14 * * 1,3,6' || github.event.inputs.action_mode == 'full_743pm_build'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg, HarfBuzz, and Malayalam Unicode fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libharfbuzz0b libfribidi0 libraqm0 fonts-noto-core fonts-smc-manjari

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow google-genai edge-tts requests pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Build & upload Long Video to YouTube (9:00 PM IST)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          FLIPKART_AFFILIATE_ID: ${{ secrets.FLIPKART_AFFILIATE_ID }}
          YT_PRIVACY_STATUS: "private"
          TTS_VOICE: "ml-IN-MidhunNeural"
          LONG_CATEGORY: ${{ github.event.inputs.category_override || 'auto_by_day' }}
        run: |
          python generate_long_video.py

      - name: Cache rendered long video for Facebook publish (1-day retention)
        if: hashFiles('build_long/long_video.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gadget-long-video-fb-handoff
          path: |
            build_long/long_video.mp4
            build_long/long_thumb.jpg
            build_long/long_meta.json
          retention-days: 1

      - name: Commit updated long video history
        run: |
          if [ -f used_long_topics.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add used_long_topics.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: record published gadget long topic [skip ci]"
              git pull --rebase -X ours origin main || true
              git push
            fi
          fi

  publish-facebook-long:
    if: github.event.schedule == '43 15 * * 1,3,6' || github.event.inputs.action_mode == 'publish_fb_now'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest cached long video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build_long
          for RID in $(gh run list --workflow="long_videos.yml" --status=success --limit=10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$RID" --name gadget-long-video-fb-handoff --dir build_long 2>/dev/null; then
              echo "Downloaded gadget-long-video-fb-handoff from run $RID"
              break
            fi
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install requests pillow google-genai edge-tts pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Publish Long Video to Facebook Page
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python generate_long_video.py --publish-fb-only
