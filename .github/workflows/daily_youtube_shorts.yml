name: Gadget Pulse Malayalam Shorts + Reels Automation

on:
  schedule:
    # 13:23 UTC = 6:53 PM IST -> Build & upload YT (Private -> 8:00 PM IST), cache Meta video
    - cron: "23 13 * * *"
    # 15:07 UTC = 8:37 PM IST -> Publish to Instagram Reels
    - cron: "07 15 * * *"
    # 15:37 UTC = 9:07 PM IST -> Publish to Facebook Page Reels
    - cron: "37 15 * * *"
  workflow_dispatch:
    inputs:
      action_mode:
        description: "Run mode"
        required: false
        default: "full_653pm_build"
        type: choice
        options:
          - "full_653pm_build"
          - "publish_ig_now"
          - "publish_fb_now"

permissions:
  contents: write
  actions: read

jobs:
  build-youtube-shorts:
    if: github.event.schedule == '23 13 * * *' || github.event.inputs.action_mode == 'full_653pm_build'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg, HarfBuzz, and Malayalam Unicode fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libharfbuzz0b libfribidi0 libraqm0 fonts-noto-core fonts-smc-manjari

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow google-genai edge-tts requests pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Generate Tech Short & upload to YouTube (8:00 PM IST)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          FLIPKART_AFFILIATE_ID: ${{ secrets.FLIPKART_AFFILIATE_ID }}
          YT_PRIVACY_STATUS: "private"
          TTS_VOICE: "ml-IN-MidhunNeural"
        run: |
          python generate_short.py

      - name: Cache Meta Reel for IG & FB (1-day retention)
        if: hashFiles('build_short/final_short_meta.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gadget-ig-reel-handoff
          path: |
            build_short/final_short_meta.mp4
            build_short/thumbnail.jpg
            build_short/meta_payload.json
          retention-days: 1

      - name: Commit updated topic history
        run: |
          if [ -f used_topics.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add used_topics.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: record published gadget topic [skip ci]"
              git pull --rebase -X ours origin main || true
              git push
            fi
          fi

  publish-instagram-reel:
    if: github.event.schedule == '07 15 * * *' || github.event.inputs.action_mode == 'publish_ig_now'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cached Reel from latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build_short
          for RID in $(gh run list --workflow="daily_youtube_shorts.yml" --status=success --limit=10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$RID" --name gadget-ig-reel-handoff --dir build_short 2>/dev/null; then
              echo "Downloaded gadget-ig-reel-handoff from run $RID"
              break
            fi
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install requests pillow google-genai edge-tts pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Stage MP4 via temporary GitHub Release for Instagram Reels
        if: hashFiles('build_short/final_short_meta.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete temp-ig-reel --yes || true
          gh release create temp-ig-reel build_short/final_short_meta.mp4 build_short/thumbnail.jpg --title "Temp IG Reel Handoff" --notes "Temporary asset for Instagram Reels"

      - name: Publish to Instagram Reels
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PUBLIC_VIDEO_URL: "https://github.com/${{ github.repository }}/releases/download/temp-ig-reel/final_short_meta.mp4"
          IG_PUBLIC_THUMB_URL: "https://github.com/${{ github.repository }}/releases/download/temp-ig-reel/thumbnail.jpg"
        run: |
          python generate_short.py --publish-ig-only

      - name: Clean up temporary GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete temp-ig-reel --yes --cleanup-tag || true

  publish-facebook-reel:
    if: github.event.schedule == '37 15 * * *' || github.event.inputs.action_mode == 'publish_fb_now'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download cached Reel from latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build_short
          for RID in $(gh run list --workflow="daily_youtube_shorts.yml" --status=success --limit=10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$RID" --name gadget-ig-reel-handoff --dir build_short 2>/dev/null; then
              echo "Downloaded gadget-ig-reel-handoff from run $RID"
              break
            fi
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install requests pillow google-genai edge-tts pydantic google-api-python-client google-auth google-auth-oauthlib

      - name: Publish to Facebook Page Reels
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python generate_short.py --publish-fb-only
